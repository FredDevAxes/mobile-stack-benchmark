name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: xcodebuild -version
      - run: xcrun swift-format lint --strict -r apps/swift
      - run: swift test --package-path apps/swift
      - run: python3 scripts/build_swift.py S
      - run: python3 scripts/build_swift.py A
      - run: python3 scripts/build_swift.py S --device
      - run: python3 scripts/build_swift.py A --device
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/check_assets.py
      - run: |
          mkdir -p .work
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.7.1/ktlint-cli-1.7.1-all.jar -o .work/ktlint.jar
          echo '5f3de4ee4014137b05c72ed68eb46fe686aeb11fbdef27faf77f55d51c1b2536  .work/ktlint.jar' | sha256sum -c
          java -jar .work/ktlint.jar 'apps/compose/**/*.kt' 'apps/compose/**/*.kts' '!**/build/**'
      - run: python3 scripts/lab.py lint --stack compose
      - run: python3 scripts/lab.py test --stack compose
      - run: python3 scripts/lab.py build --stack compose --platform android --variant S
      - run: python3 scripts/lab.py build --stack compose --platform android --variant A
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - run: pip install -r requirements.lock
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: python3 scripts/check_assets.py
      - run: |
          mkdir -p .work/security
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .work/security/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o .work/security/checksums.txt
          cd .work/security
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 }' checksums.txt)
          echo "$expected  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz
          cd ../..
          .work/security/gitleaks git --redact --no-banner
  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-26
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17.0.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: matrix.target == 'android'
        with:
          packages: platform-tools
      - if: matrix.target == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: |
          mkdir -p .local
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git .local/flutter
          test "$(git -C .local/flutter rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$PWD/.local/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: python3 scripts/prepare.py A
      - working-directory: apps/flutter
        run: flutter pub get --enforce-lockfile
      - run: python3 scripts/lab.py lint --stack flutter
      - run: python3 scripts/lab.py test --stack flutter
      - if: matrix.target == 'android'
        run: |
          python3 scripts/lab.py build --stack flutter --platform android --variant S
          python3 scripts/lab.py build --stack flutter --platform android --variant A
      - if: matrix.target == 'ios'
        run: |
          python3 scripts/lab.py build --stack flutter --platform simulator --variant S
          python3 scripts/lab.py build --stack flutter --platform simulator --variant A
          python3 scripts/lab.py build --stack flutter --platform device --variant S
          python3 scripts/lab.py build --stack flutter --platform device --variant A
  react-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-26
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: apps/react-native/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17.0.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: matrix.target == 'android'
        with:
          packages: platform-tools
      - if: matrix.target == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        if: matrix.target == 'ios'
        with:
          ruby-version: '3.3.6'
          bundler: '2.6.2'
          bundler-cache: true
          working-directory: apps/react-native
      - working-directory: apps/react-native
        run: npm ci
      - if: matrix.target == 'ios'
        working-directory: apps/react-native/ios
        run: bundle _2.6.2_ exec pod install --deployment
      - run: python3 scripts/lab.py lint --stack react-native
      - run: python3 scripts/lab.py test --stack react-native
      - if: matrix.target == 'android'
        run: |
          python3 scripts/lab.py build --stack react-native --platform android --variant S
          python3 scripts/lab.py build --stack react-native --platform android --variant A
      - if: matrix.target == 'ios'
        run: |
          python3 scripts/lab.py build --stack react-native --platform simulator --variant S
          python3 scripts/lab.py build --stack react-native --platform simulator --variant A
          python3 scripts/lab.py build --stack react-native --platform device --variant S
          python3 scripts/lab.py build --stack react-native --platform device --variant A
