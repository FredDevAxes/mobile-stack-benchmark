name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: xcodebuild -version
      - run: xcrun swift-format lint --strict -r apps/swift
      - run: swift test --package-path apps/swift
      - run: python3 scripts/build_swift.py S
      - run: python3 scripts/build_swift.py A
      - run: python3 scripts/build_swift.py S --device
      - run: python3 scripts/build_swift.py A --device
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/check_assets.py
      - run: |
          mkdir -p .work
          curl -fsSL https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.7.1/ktlint-cli-1.7.1-all.jar -o .work/ktlint.jar
          echo '5f3de4ee4014137b05c72ed68eb46fe686aeb11fbdef27faf77f55d51c1b2536  .work/ktlint.jar' | sha256sum -c
          java -jar .work/ktlint.jar 'apps/compose/**/*.kt' 'apps/compose/**/*.kts' '!**/build/**'
      - working-directory: apps/compose
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleInstantRelease :app:assembleAnimatedRelease :app:testInstantDebugUnitTest :app:testAnimatedDebugUnitTest :app:lintInstantRelease :app:lintAnimatedRelease
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - run: pip install -r requirements.lock
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: python3 scripts/check_assets.py
      - run: |
          mkdir -p .work/security
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .work/security/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o .work/security/checksums.txt
          cd .work/security
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 }' checksums.txt)
          echo "$expected  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz
          cd ../..
          .work/security/gitleaks git --redact --no-banner
